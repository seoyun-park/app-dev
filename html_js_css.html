<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>이름 입력하기</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 60px;
            font-size: 24px;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 250px;
            padding: 12px;
            border: 3px solid #5784b3;
            font-size: 22px;
        }

        button {
            padding: 12px 35px;
            border: 3px solid #5784b3;
            background-color: white;
            font-size: 22px;
            cursor: pointer;
        }

        button:hover {
            background-color: #dcecff;
        }

        #resultName {
            color: #1465a5;
        }
    </style>
</head>

<body>
    <div class="input-area">
        <label for="nameInput">이름</label>

        <input
            type="text"
            id="nameInput"
            placeholder="이름을 입력하세요"
        >

        <button type="button" id="submitButton">입력</button>
    </div>

    <p>
        당신의 이름은
        <strong id="resultName">_____</strong>
        입니다.
    </p>

    <script>
        const nameInput = document.querySelector("#nameInput");
        const submitButton = document.querySelector("#submitButton");
        const resultName = document.querySelector("#resultName");

        function showName() {
            const name = nameInput.value.trim();

            if (name === "") {
                alert("이름을 입력해주세요.");
                nameInput.focus();
                return;
            }

            resultName.textContent = name;
        }

        submitButton.addEventListener("click", showName);

        nameInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                showName();
            }
        });
    </script>
</body>
</html>
